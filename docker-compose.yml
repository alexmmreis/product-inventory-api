services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: product-inventory-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/ProductInventory.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ApplyMigrationsOnStartup: "true"
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=ProductInventory;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - api-logs:/app/logs
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    container_name: product-inventory-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  sqlserver-data:
  api-logs:
