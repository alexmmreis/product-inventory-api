events {}

http {
    # Docker's embedded DNS (127.0.0.11) round-robins across every replica of the "api" service.
    # Using a variable (instead of a static `upstream` block) forces nginx to re-resolve it
    # periodically instead of caching a single IP for the process lifetime.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        location / {
            set $api_upstream http://api:8080;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
